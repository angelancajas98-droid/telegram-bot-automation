stages: [validate,test,build,deploy,smoke-test]

image: node:22

cache:
  paths: [node_modules/]

validate:
  stage: validate
  script:
    - npm ci
    - npm run format:check
    - npm run lint
    - npm run typecheck
    - npx wrangler deploy --dry-run

test:
  stage: test
  script:
    - npm ci
    - npm test

build:
  stage: build
  script:
    - npm ci
    - npx wrangler deploy --dry-run
  artifacts:
    when: always
    expire_in: 1 day
    paths: [dist/]

deploy_staging:
  stage: deploy
  environment: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - npm ci
    - npx wrangler deploy --env staging

deploy_production:
  stage: deploy
  environment:
    name: production
  when: manual
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - npm ci
    - npx wrangler deploy

smoke_test:
  stage: smoke-test
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - test -n "$WORKER_URL"
    - curl --fail "$WORKER_URL"
